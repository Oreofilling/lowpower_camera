<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>NeoLink 扫码引导流程样例</title>
  <style>
    :root {
      --ink: #142033;
      --muted: #667287;
      --line: #dce3ed;
      --surface: #ffffff;
      --soft: #f5f7fa;
      --blue: #315bd7;
      --blue-dark: #2345ad;
      --blue-soft: #eef2ff;
      --green: #14815c;
      --green-soft: #eaf8f2;
      --amber: #a86608;
      --amber-soft: #fff6df;
      --red: #bb3e3a;
      --red-soft: #fff0ee;
      --shadow: 0 28px 80px rgba(39, 54, 84, 0.18);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(64, 102, 213, 0.15), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(20, 129, 92, 0.10), transparent 24%),
        #eef2f7;
    }

    button { font: inherit; }
    button:focus-visible {
      outline: 3px solid rgba(49, 91, 215, 0.25);
      outline-offset: 2px;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .preview-bar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .preview-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 750;
      color: #3e4a60;
    }

    .preview-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: var(--ink);
      font-size: 10px;
      letter-spacing: -0.04em;
    }

    .prototype-pill {
      padding: 7px 11px;
      border: 1px solid rgba(49, 91, 215, 0.16);
      border-radius: 999px;
      color: var(--blue-dark);
      background: rgba(238, 242, 255, 0.8);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .app {
      min-height: 720px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      grid-template-rows: 54px minmax(0, 1fr);
      border: 1px solid rgba(87, 103, 132, 0.18);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #edf0f5;
      background: #fbfcfe;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 800;
    }

    .brand-icon {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: linear-gradient(145deg, #4671ea, #294cbd);
      font-size: 9px;
      font-weight: 900;
    }

    .titlebar {
      color: #8a93a2;
      font-size: 12px;
      font-weight: 650;
    }

    .dots {
      justify-self: end;
      display: flex;
      gap: 6px;
    }

    .dots i {
      width: 8px;
      height: 8px;
      display: block;
      border-radius: 50%;
      background: #d7dce5;
    }

    .sidebar {
      padding: 28px 22px;
      border-right: 1px solid #edf0f5;
      background: #f8fafc;
    }

    .side-kicker {
      margin-bottom: 17px;
      color: #8a93a2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .steps {
      display: grid;
      gap: 4px;
    }

    .step {
      position: relative;
      min-height: 58px;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      align-items: start;
      padding: 9px 8px;
      border-radius: 12px;
      color: #7a8495;
    }

    .step::after {
      content: "";
      position: absolute;
      left: 22px;
      top: 42px;
      bottom: -13px;
      width: 1px;
      background: #dce2eb;
    }

    .step:last-child::after { display: none; }

    .step-dot {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #d5dce7;
      border-radius: 50%;
      background: white;
      font-size: 11px;
      font-weight: 800;
      z-index: 1;
    }

    .step strong,
    .step span { display: block; }
    .step strong {
      margin: 2px 0 3px;
      color: #596579;
      font-size: 13px;
    }
    .step span { font-size: 11px; line-height: 1.4; }

    .step.done .step-dot {
      color: white;
      border-color: var(--green);
      background: var(--green);
    }

    .step.active {
      color: #536078;
      background: white;
      box-shadow: 0 7px 20px rgba(42, 58, 88, 0.08);
    }

    .step.active .step-dot {
      color: white;
      border-color: var(--blue);
      background: var(--blue);
      box-shadow: 0 0 0 5px rgba(49, 91, 215, 0.10);
    }

    .step.active strong { color: var(--ink); }

    .side-note {
      margin-top: 25px;
      padding: 14px;
      border: 1px solid #dce3ed;
      border-radius: 13px;
      color: var(--muted);
      background: white;
      font-size: 11px;
      line-height: 1.55;
    }

    .side-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 12px;
    }

    .content {
      position: relative;
      min-width: 0;
      padding: clamp(30px, 5vw, 62px);
      background: white;
    }

    .screen {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 9px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #121d2f;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 650px;
      margin: 14px 0 25px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
    }

    .channel-row,
    .guide-row {
      display: grid;
      grid-template-columns: 36px minmax(120px, 0.75fr) minmax(170px, 1.25fr);
      gap: 12px;
      align-items: center;
      min-height: 62px;
      padding: 11px 16px;
      border-bottom: 1px solid #edf0f5;
    }

    .channel-row:last-child,
    .guide-row:last-child { border-bottom: 0; }

    .status-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--blue-dark);
      background: var(--blue-soft);
      font-size: 11px;
      font-weight: 850;
    }

    .channel-row strong,
    .guide-row strong { font-size: 13px; }
    .channel-row span:last-child,
    .guide-row span:last-child {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .pulse { position: relative; }
    .pulse::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 2px solid rgba(49, 91, 215, 0.22);
      border-radius: 13px;
      animation: pulse 1.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(0.85); }
      100% { opacity: 0; transform: scale(1.25); }
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      min-height: 43px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 760;
      transition: transform 120ms ease, background 120ms ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: white; background: var(--blue); }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.secondary {
      color: #354158;
      border-color: var(--line);
      background: white;
    }
    .btn.secondary:hover { background: var(--soft); }
    .btn.quiet { color: var(--blue-dark); background: var(--blue-soft); }
    .btn.danger { color: var(--red); background: var(--red-soft); }

    .info-strip {
      margin-top: 17px;
      padding: 12px 14px;
      border-radius: 12px;
      color: #556177;
      background: var(--soft);
      font-size: 12px;
      line-height: 1.55;
    }
    .info-strip strong { color: var(--ink); }
    .info-strip.blue { color: #3c4f7c; background: var(--blue-soft); }
    .info-strip.green { color: #2f6754; background: var(--green-soft); }
    .info-strip.amber { color: #765015; background: var(--amber-soft); }

    .qr-layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(250px, 1.1fr);
      gap: 18px;
    }

    .camera {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: white;
      background:
        radial-gradient(circle at 55% 30%, rgba(88, 111, 141, 0.42), transparent 27%),
        linear-gradient(150deg, #1b2739, #07101d);
    }

    .camera::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(3, 9, 18, 0.3));
      pointer-events: none;
    }

    .finder {
      position: relative;
      z-index: 1;
      width: 210px;
      height: 210px;
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      gap: 2px;
      padding: 18px;
      border: 2px solid rgba(255,255,255,0.88);
      border-radius: 22px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 18px 45px rgba(0,0,0,0.26);
    }

    .finder i {
      display: block;
      aspect-ratio: 1;
      border-radius: 1px;
      background: transparent;
    }
    .finder i.on { background: #111827; }

    .scan-line {
      position: absolute;
      z-index: 2;
      left: calc(50% - 94px);
      top: calc(50% - 86px);
      width: 188px;
      height: 2px;
      background: #57e2b4;
      box-shadow: 0 0 15px #57e2b4;
      animation: scanline 2.2s ease-in-out infinite;
    }
    @keyframes scanline {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(172px); }
    }

    .camera-label {
      position: absolute;
      z-index: 3;
      left: 18px;
      right: 18px;
      bottom: 15px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.78);
    }

    .qr-copy {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
    }

    .qr-copy p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .qr-copy .btn { width: 100%; margin-top: 9px; }

    code.uri {
      display: block;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 10px;
      color: #38486b;
      background: var(--blue-soft);
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .parsed-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .parsed-item {
      min-height: 80px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
    }
    .parsed-item span,
    .parsed-item strong { display: block; }
    .parsed-item span {
      margin-bottom: 7px;
      color: #8992a1;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .parsed-item strong { font-size: 14px; overflow-wrap: anywhere; }

    .scanning-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      padding: 12px 14px;
      border-radius: 12px;
      color: #3a4d78;
      background: var(--blue-soft);
      font-size: 12px;
      font-weight: 650;
    }
    .spinner {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      border: 2px solid rgba(49, 91, 215, 0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .candidate {
      width: 100%;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 13px;
      align-items: center;
      padding: 15px;
      border: 1px solid #b8c8f4;
      border-radius: 15px;
      text-align: left;
      color: var(--ink);
      background: var(--blue-soft);
      box-shadow: 0 0 0 3px rgba(49, 91, 215, 0.08);
    }

    .candidate-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: var(--blue);
      font-size: 11px;
      font-weight: 900;
    }
    .candidate strong,
    .candidate span { display: block; }
    .candidate strong { margin-bottom: 4px; font-size: 14px; }
    .candidate span { color: #5f6f91; font-size: 12px; }
    .candidate em {
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--blue-dark);
      background: white;
      font-size: 10px;
      font-style: normal;
      font-weight: 800;
    }

    .error-card {
      padding: 18px;
      border: 1px solid #f0c6c3;
      border-radius: 15px;
      background: var(--red-soft);
    }
    .error-card strong { color: var(--red); }
    .error-card p {
      margin: 7px 0 0;
      color: #7b5554;
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 780px) {
      .page { width: min(100% - 18px, 520px); padding-top: 10px; }
      .preview-bar { padding: 0 6px; }
      .app {
        min-height: 760px;
        grid-template-columns: 1fr;
        grid-template-rows: 50px auto 1fr;
        border-radius: 22px;
      }
      .sidebar {
        overflow-x: auto;
        display: block;
        padding: 12px 15px;
        border-right: 0;
        border-bottom: 1px solid #edf0f5;
      }
      .side-kicker, .side-note { display: none; }
      .steps { display: flex; min-width: 610px; }
      .step {
        min-height: 43px;
        flex: 1;
        grid-template-columns: 23px 1fr;
        gap: 6px;
        padding: 6px;
      }
      .step::after { display: none; }
      .step-dot { width: 22px; height: 22px; font-size: 9px; }
      .step strong { margin-top: 2px; font-size: 10px; }
      .step span { display: none; }
      .content { padding: 28px 20px 34px; }
      .qr-layout { grid-template-columns: 1fr; }
      .camera { min-height: 300px; }
      .channel-row, .guide-row {
        grid-template-columns: 34px 1fr;
      }
      .channel-row span:last-child,
      .guide-row span:last-child { grid-column: 2; }
      .parsed-grid { grid-template-columns: 1fr; }
      .titlebar { display: none; }
      .topbar { grid-template-columns: 1fr auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="preview-bar">
      <div class="preview-brand"><span class="preview-mark">NL</span>NeoLink 扫码引导流程</div>
      <span class="prototype-pill">Interactive prototype</span>
    </div>

    <section class="app" aria-label="NeoLink 扫码引导交互样例">
      <header class="topbar">
        <div class="brand"><span class="brand-icon">NL</span>NeoLink</div>
        <div class="titlebar">设备扫描工具 · 不保存设备信息</div>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </header>

      <aside class="sidebar">
        <div class="side-kicker">当前扫码流程</div>
        <div class="steps" id="steps"></div>
        <div class="side-note">
          <strong>设计边界</strong>
          二维码只用来找到正确的操作指引和定向重扫目标，不会直接连接设备、不会下发网络参数。
        </div>
      </aside>

      <section class="content">
        <div class="screen" id="screen" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script>
    const flowSteps = [
      ["scan", "常规扫描", "BLE、AP、CT-Disc"],
      ["empty", "未发现设备", "显示扫码入口"],
      ["qr", "扫描指引码", "解析型号与指引"],
      ["parsed", "校验结果", "不直接创建连接"],
      ["guide", "展示操作指引", "后台定向重扫"],
      ["found", "发现目标", "高亮后由用户选择"]
    ];

    const state = { page: "scan" };
    const screen = document.getElementById("screen");
    const steps = document.getElementById("steps");

    const qrBits = Array.from({ length: 289 }, (_, i) => {
      const x = i % 17;
      const y = Math.floor(i / 17);
      const finder = (x < 5 && y < 5) || (x > 11 && y < 5) || (x < 5 && y > 11);
      const ring = finder && (x % 12 === 0 || y % 12 === 0 || x % 12 === 4 || y % 12 === 4);
      const core = finder && ((x % 12 > 1 && x % 12 < 4) && (y % 12 > 1 && y % 12 < 4));
      const noise = ((x * 7 + y * 11 + x * y) % 5) < 2;
      return `<i class="${ring || core || noise ? "on" : ""}"></i>`;
    }).join("");

    function stepIndex(page) {
      if (page === "error") return 2;
      return Math.max(0, flowSteps.findIndex(([id]) => id === page));
    }

    function renderSteps() {
      const current = stepIndex(state.page);
      steps.innerHTML = flowSteps.map(([id, title, desc], index) => `
        <div class="step ${index < current ? "done" : ""} ${index === current ? "active" : ""}">
          <span class="step-dot">${index < current ? "✓" : index + 1}</span>
          <div><strong>${title}</strong><span>${desc}</span></div>
        </div>`).join("");
    }

    function renderScan() {
      screen.innerHTML = `
        <div class="eyebrow">设备发现</div>
        <h1>扫描附近设备</h1>
        <p class="lead">扫码不是必要步骤。NeoLink 会先同时扫描 BLE、设备 AP 和当前局域网中的 CT-Disc 设备。</p>
        <div class="card">
          <div class="channel-row"><span class="status-icon pulse">B</span><strong>BLE 扫描中</strong><span>查找 CT-Prov Service Data</span></div>
          <div class="channel-row"><span class="status-icon pulse">A</span><strong>设备 AP 扫描中</strong><span>查找 CT-AP-&lt;MAC_SUFFIX&gt;</span></div>
          <div class="channel-row"><span class="status-icon pulse">C</span><strong>CT-Disc 扫描中</strong><span>当前物理网卡与广播域</span></div>
        </div>
        <div class="buttons">
          <button class="btn primary" data-go="empty">模拟扫描超时</button>
          <button class="btn secondary" data-go="found">模拟直接发现设备</button>
        </div>
        <div class="info-strip"><strong>关键规则：</strong>已扫描到设备时直接进入候选列表，页面不要强制用户先扫二维码。</div>`;
    }

    function renderEmpty() {
      screen.innerHTML = `
        <div class="eyebrow">扫描完成</div>
        <h1>暂未发现设备</h1>
        <p class="lead">请确认设备已通电并进入可发现状态。NeoLink 会继续低频扫描；如果不知道如何开启设备，可以扫码查看指引。</p>
        <div class="card">
          <div class="channel-row"><span class="status-icon">B</span><strong>BLE</strong><span>未发现 CT-Prov 广播</span></div>
          <div class="channel-row"><span class="status-icon">A</span><strong>设备 AP</strong><span>未发现匹配的热点</span></div>
          <div class="channel-row"><span class="status-icon">C</span><strong>CT-Disc</strong><span>当前局域网无设备响应</span></div>
        </div>
        <div class="buttons">
          <button class="btn primary" data-go="scan">重新扫描</button>
          <button class="btn secondary" data-go="qr">扫码获取开启指引</button>
        </div>
        <div class="info-strip amber">用户也可以不扫码，直接按通用提示操作后点击“重新扫描”。</div>`;
    }

    function renderQr() {
      screen.innerHTML = `
        <div class="eyebrow">设备开启指引</div>
        <h1>扫描设备指引二维码</h1>
        <p class="lead">二维码只识别型号、MAC 后缀、可能的发现通道和内置指引编号。</p>
        <div class="qr-layout">
          <div class="camera" aria-label="二维码相机模拟区">
            <div class="finder">${qrBits}</div><div class="scan-line"></div>
            <div class="camera-label">将设备或包装上的二维码放入框内</div>
          </div>
          <div class="qr-copy">
            <h2>样例二维码内容</h2>
            <p>此原型不调用真实相机，使用下面的规范 URI 模拟识别。</p>
            <code class="uri">ctdev://guide-v1/A1B2C3?m=NE101&amp;c=03&amp;g=ne101_config_button_v1</code>
            <button class="btn primary" data-go="parsed">模拟识别成功</button>
            <button class="btn danger" data-go="error">模拟无效二维码</button>
            <button class="btn secondary" data-go="empty">返回</button>
          </div>
        </div>`;
    }

    function renderParsed() {
      screen.innerHTML = `
        <div class="eyebrow">二维码已校验</div>
        <h1>找到 NE101 开启指引</h1>
        <p class="lead">NeoLink 只保留本次指引所需的临时信息。此时还没有连接设备，也没有创建配置会话。</p>
        <div class="parsed-grid">
          <div class="parsed-item"><span>Model</span><strong>NE101</strong></div>
          <div class="parsed-item"><span>MAC suffix</span><strong>A1B2C3</strong></div>
          <div class="parsed-item"><span>Discovery hints</span><strong>BLE · 设备 AP</strong></div>
          <div class="parsed-item"><span>Guide ID</span><strong>ne101_config_button_v1</strong></div>
        </div>
        <div class="info-strip blue"><strong>不会执行：</strong>不直接建立 BLE/AP 连接，不以二维码决定设备能力，不下发 Wi-Fi 密码或其他通讯参数。</div>
        <div class="buttons">
          <button class="btn primary" data-go="guide">打开内置指引</button>
          <button class="btn secondary" data-go="qr">重新扫码</button>
        </div>`;
    }

    function renderGuide() {
      screen.innerHTML = `
        <div class="eyebrow">NE101 · A1B2C3</div>
        <h1>让设备进入可发现状态</h1>
        <p class="lead">指引来自 NeoLink 安装包，不会打开二维码中的外部网页。页面打开后，定向扫描已在后台开始。</p>
        <div class="card">
          <div class="guide-row"><span class="status-icon">1</span><strong>确认设备通电</strong><span>等待设备完成启动</span></div>
          <div class="guide-row"><span class="status-icon">2</span><strong>长按 CONFIG 键 3 秒</strong><span>按键位于机身侧面</span></div>
          <div class="guide-row"><span class="status-icon">3</span><strong>等待蓝灯快速闪烁</strong><span>表示 BLE 和设备 AP 已开启</span></div>
        </div>
        <div class="scanning-bar"><span class="spinner"></span>正在定向扫描 NE101-A1B2C3 · BLE · CT-AP-A1B2C3</div>
        <div class="buttons">
          <button class="btn primary" data-go="found">模拟发现目标设备</button>
          <button class="btn secondary" data-go="guide">我已完成，重新扫描</button>
          <button class="btn secondary" data-go="empty">取消指引</button>
        </div>`;
    }

    function renderFound() {
      const guided = state.previous === "guide" || state.previous === "parsed";
      screen.innerHTML = `
        <div class="eyebrow">实时扫描结果</div>
        <h1>${guided ? "已发现指引中的设备" : "已发现设备"}</h1>
        <p class="lead">二维码只用于筛选和高亮。连接前仍由用户确认候选设备与配置通道。</p>
        <button class="candidate" type="button">
          <span class="candidate-icon">101</span>
          <span><strong>NE101 · MAC A1B2C3</strong><span>BLE -58 dBm · 设备 AP · 可配置</span></span>
          <em>${guided ? "指引目标" : "扫描发现"}</em>
        </button>
        <div class="info-strip green"><strong>下一步才是连接：</strong>用户选择 BLE 或设备 AP 后，NeoLink 才创建临时配置连接，并从设备读取真实信息和通讯能力。</div>
        <div class="buttons">
          <button class="btn primary" data-action="finish">选择设备并继续</button>
          <button class="btn secondary" data-go="scan">返回扫描</button>
          <button class="btn quiet" data-action="restart">重播扫码流程</button>
        </div>`;
    }

    function renderError() {
      screen.innerHTML = `
        <div class="eyebrow">二维码校验失败</div>
        <h1>无法识别该设备指引</h1>
        <p class="lead">NeoLink 不应从未知二维码打开链接，也不应把它当作设备凭证或配置指令。</p>
        <div class="error-card"><strong>INVALID_GUIDE_QR</strong><p>Scheme、版本或字段集合不符合 CT Device Guide QR 规范。本次解析结果已丢弃。</p></div>
        <div class="buttons">
          <button class="btn primary" data-go="qr">重新扫码</button>
          <button class="btn secondary" data-go="empty">返回未发现设备</button>
        </div>`;
    }

    const renders = {
      scan: renderScan,
      empty: renderEmpty,
      qr: renderQr,
      parsed: renderParsed,
      guide: renderGuide,
      found: renderFound,
      error: renderError
    };

    function navigate(page) {
      state.previous = state.page;
      state.page = page;
      renderSteps();
      renders[page]();
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.go) navigate(target.dataset.go);
      if (target.dataset.action === "restart") navigate("empty");
      if (target.dataset.action === "finish") {
        alert("扫码引导流程到此结束。\n后续进入「选择配置通道 → 连接 → 读取设备能力」流程。");
      }
    });

    renderSteps();
    renderScan();
  </script>
</body>
</html>
